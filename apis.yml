aid: dclimate
name: dClimate
description: >-
  dClimate is a chain-agnostic, decentralized climate information ecosystem that
  makes it easy for businesses, governments, and builders to find, access, and
  utilize essential data about the planet. Rather than a conventional REST API,
  dClimate exposes its weather and climate data SDK-first over content-addressed
  (IPFS/IPLD) storage: official Python and JavaScript clients resolve datasets
  from a STAC catalog and stream sharded Zarr stores, requiring no API key or
  OAuth for public data. Offerings span weather/climate reanalysis and forecast
  sources such as ECMWF ERA5 and AIFS, a Data Marketplace featuring datasets from
  providers like NASA and ESA, plus the Aegis and CYCLOPS climate-intelligence
  platforms. Backed by Multicoin Capital.
